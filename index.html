<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>별자리 찾기</title>
<meta name="description" content="밤하늘 별자리를 3D로 둘러보고, 사진 속 별자리를 찾아보는 앱">
<meta name="theme-color" content="#070d1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="별자리 찾기">
<style>
/* 글꼴(앱 안에 들어 있음 — 인터넷이 없어도 보임) */
@font-face{font-family:"Jua";src:url("fonts/Jua.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Gowun Dodum";src:url("fonts/GowunDodum.woff2") format("woff2");font-display:swap;}
/* 화면 구성: 밤하늘이 화면 전체를 채우고, 위에는 제목·해설·나침반, 아래(가로 화면은 왼쪽)에는 조작 패널 */
:root{
  --night:#070d1f;      /* 밤하늘 바탕 */
  --panel:rgba(13,21,46,.88);
  --panel-solid:#0f1834;
  --line:#2b3a6b;
  --ink:#eef1ff;        /* 기본 글자 */
  --ink-soft:#aab4dd;
  --gold:#ffd15c;       /* 고른 별자리, 강조 */
  --sky:#8fb4ff;        /* 별자리 선 */
  --mint:#7ee0c3;       /* 도장 */
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;}
body{font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
#app{position:fixed;inset:0;background:var(--night);}
#sky{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;}
#camvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75;}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;color:#c9d6ff;opacity:.85;text-shadow:0 0 4px #000,0 0 2px #000;will-change:transform;pointer-events:auto;padding:4px 6px;cursor:pointer;}
.lbl.sel{color:var(--gold);font-family:var(--display);font-size:16px;opacity:1;}
.lbl.star{font-size:11px;color:#ffe9b8;opacity:.75;pointer-events:none;padding:0 0 0 8px;}
.lbl.dir{font-family:var(--display);font-size:20px;color:#ffb86b;opacity:.95;pointer-events:none;}
.lbl.dir.small{font-size:14px;opacity:.7;}
.hidden-lbl{display:none;}

/* 위쪽 묶음 */
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;}
#bar{display:flex;align-items:center;gap:8px;pointer-events:auto;}
#bar h1{font-family:var(--display);font-weight:400;font-size:20px;margin:0;color:var(--gold);letter-spacing:.5px;}
#clock{font-size:12px;color:var(--ink-soft);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13px;white-space:nowrap;}
.icon-btn.main{background:#3a2f0b;border-color:#8a6c1c;color:var(--gold);font-family:var(--display);font-size:15px;}
#hudrow{display:flex;gap:8px;align-items:flex-start;}
#bubble{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:14px;line-height:1.45;pointer-events:auto;transition:border-color .3s;}
#bubble.flash{border-color:var(--gold);}
#compass{width:58px;height:58px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:50%;position:relative;pointer-events:none;}
#compass svg{width:100%;height:100%;display:block;}
#compass .alt{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:11px;color:var(--ink-soft);text-shadow:0 0 3px #000;}

/* 아래쪽 묶음(세로 화면) */
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));pointer-events:none;}
#info{pointer-events:auto;background:var(--panel);border:1px solid #6b5520;border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;}
#info .txt{flex:1;min-width:0;}
#info h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 2px;color:var(--gold);}
#info p{margin:0;font-size:14px;line-height:1.5;}
#info #mythBtn{margin-top:8px;font-size:13px;padding:5px 12px;}
#info #mythText{margin-top:8px;padding-top:8px;border-top:1px dashed #6b5520;max-height:28vh;overflow-y:auto;color:#f3e6c2;}
@media (orientation:landscape) and (max-height:560px){#info #mythText{max-height:none;overflow:visible;}}
#info .x{background:none;border:none;font-size:20px;padding:0 4px;color:var(--ink-soft);}
#panel{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:8px;}
.row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
#pctrl>*{flex-shrink:0;}
.row::-webkit-scrollbar{display:none;}
.row .lab{font-size:12px;color:var(--ink-soft);flex:none;width:34px;}
.chip{flex:none;background:#16224a;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap;}
.chip.on{background:#3b3212;border-color:var(--gold);color:var(--gold);}
.chip.go{background:#13324a;border-color:#3d7fb0;}
#menuBtn{display:none;}
#bar .brk{display:none;}
@media (max-width:520px){
  #bar{flex-wrap:wrap;row-gap:2px;}
  #bar h1{font-size:18px;white-space:nowrap;}
  #clock{flex:1 1 0;}
  #bar .brk{display:block;flex-basis:100%;height:0;}
  #bar .icon-btn{order:3;}
  .icon-btn{padding:6px 8px;font-size:12px;}
  .icon-btn.main{font-size:14px;}
}

/* 가로 화면: 패널을 왼쪽으로 접어 둔다 */
@media (orientation:landscape) and (max-height:560px){
  #bottom{top:var(--topH,110px);bottom:0;right:auto;width:min(300px,46vw);padding:0 0 calc(env(safe-area-inset-bottom,0px) + 8px) max(8px,env(safe-area-inset-left,0px));flex-direction:column-reverse;justify-content:flex-end;}
  #panel{border-radius:16px;border-bottom:1px solid var(--line);max-height:100%;overflow-y:auto;padding-bottom:10px;box-sizing:border-box;}
  #panel .row{flex-wrap:wrap;overflow:visible;}
  #info{position:fixed;box-sizing:border-box;overflow-y:auto;max-height:calc(100% - var(--topH,110px) - 24px);right:max(8px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:min(300px,40vw);}
  body.collapsed #panel{display:none;}
  #menuBtn{display:inline-block;}
}

/* 도장판 */
.sheet{position:absolute;inset:0;background:rgba(4,8,20,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));}
.sheet .card{width:min(560px,100%);max-height:84%;overflow-y:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);}
.sheet h2{font-family:var(--display);font-weight:400;margin:0 0 4px;color:var(--gold);font-size:22px;}
.sheet .sub{color:var(--ink-soft);font-size:13px;margin:0 0 12px;}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.mission{background:#131d40;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;display:flex;gap:10px;align-items:center;}
.mission .stamp{width:42px;height:42px;flex:none;border-radius:50%;border:2px dashed #3b4a7d;display:grid;place-items:center;font-family:var(--display);font-size:13px;color:#3b4a7d;transform:rotate(-12deg);}
.mission.done .stamp{border:3px solid var(--mint);color:var(--mint);background:rgba(126,224,195,.08);}
.mission .nm{font-size:14px;line-height:1.35;}
.mission .hint{display:none;font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}
.mission.open .hint{display:block;}
.close-wide{margin-top:14px;width:100%;padding:10px;border-radius:12px;background:#16224a;border:1px solid var(--line);}

#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6) rotate(-10deg);opacity:0;z-index:30;pointer-events:none;text-align:center;font-family:var(--display);color:var(--mint);border:4px solid var(--mint);border-radius:50%;width:150px;height:150px;display:grid;place-items:center;background:rgba(7,13,31,.85);font-size:18px;line-height:1.3;padding:10px;box-sizing:border-box;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .3s;}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-10deg);}

/* 사진으로 찾기 화면 */
#photo{position:absolute;inset:0;z-index:10;background:#050915;display:flex;flex-direction:column;overflow:hidden;}
#photo header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));}
#photo header h2{font-family:var(--display);font-weight:400;margin:0;font-size:19px;color:var(--gold);flex:1;min-width:0;}
#pbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
#stagecol{flex:1 1 50%;min-height:220px;display:flex;flex-direction:column;background:#02040b;}
#stage{position:relative;flex:1;min-height:0;touch-action:none;}
#pcanvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#adjust{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px 12px;}
#adjust button{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:17px;padding:0;}
#stageMsg{font-size:13px;color:var(--ink);padding:4px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));min-height:18px;line-height:1.4;}
#pctrl{flex:1 1 50%;min-height:0;overflow-y:auto;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;}
#pctrl .row{flex-wrap:nowrap;}
#pctrl .row .lab{width:auto;font-size:13px;}
#pctrl .row.wrap{flex-wrap:wrap;}
.findBtn{background:#3a2f0b;border:1px solid var(--gold);color:var(--gold);font-family:var(--display);font-size:18px;border-radius:14px;padding:11px;}
.findBtn:disabled{opacity:.5;}
#results{display:flex;flex-direction:column;gap:6px;}
.res{display:flex;align-items:center;gap:10px;background:#111a3a;border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;}
.res.on{border-color:var(--gold);background:#2a2410;}
.res .rk{font-family:var(--display);width:22px;color:var(--ink-soft);}
.res .nm{flex:1;min-width:0;font-family:var(--display);font-size:16px;}
.res .nm small{display:block;font-family:var(--body);font-size:12px;color:var(--ink-soft);}
.res .bar{width:70px;height:8px;border-radius:4px;background:#22305e;overflow:hidden;flex:none;}
.res .bar i{display:block;height:100%;background:var(--gold);}
.res .pc{width:40px;text-align:right;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.note{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0;}
@media (orientation:landscape) and (max-height:560px){
  #pbody{flex-direction:row;}
  #stagecol{flex:1 1 auto;min-height:0;}
  #pctrl{flex:0 0 min(330px,45vw);}
  #pctrl .row{flex-wrap:wrap;}
}
@media (orientation:landscape) and (min-height:561px) and (min-width:900px){
  #pbody{flex-direction:row;}
  #stagecol{flex:1 1 auto;}
  #pctrl{flex:0 0 360px;}
  #pctrl .row{flex-wrap:wrap;}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none;}}
/* 앱 설치 안내 */
#installSheet ol{margin:0 0 4px;padding-left:22px;line-height:1.8;font-size:15px;}
#installSheet .tip{font-size:13px;color:var(--ink-soft);margin:8px 0 0;}
</style>
</head>
<body>

<div id="app">
  <video id="camvid" playsinline muted hidden></video>
  <canvas id="sky" aria-label="밤하늘"></canvas>
  <div id="labels"></div>

  <div id="top">
    <div id="bar">
      <button class="icon-btn" id="menuBtn">메뉴</button>
      <h1>별자리 찾기</h1>
      <span id="clock"></span>
      <span class="brk"></span>
      <button class="icon-btn main" id="myBtn">내 위치</button>
      <button class="icon-btn main" id="photoBtn">사진으로 찾기</button>
      <button class="icon-btn" id="soundBtn">소리 켬</button>
      <button class="icon-btn" id="fsBtn">전체화면</button>
    </div>
    <div id="hudrow">
      <div id="bubble">별자리 하늘을 준비하고 있어요…</div>
      <div id="compass">
        <svg viewBox="0 0 60 60" aria-hidden="true">
          <circle cx="30" cy="30" r="26" fill="none" stroke="#2b3a6b"/>
          <g id="cdial">
            <text x="30" y="11" text-anchor="middle" font-size="9" fill="#ff8f6b" font-family="Jua,sans-serif">북</text>
            <text x="51" y="33" text-anchor="middle" font-size="8" fill="#aab4dd" font-family="Jua,sans-serif">동</text>
            <text x="30" y="55" text-anchor="middle" font-size="8" fill="#aab4dd" font-family="Jua,sans-serif">남</text>
            <text x="9" y="33" text-anchor="middle" font-size="8" fill="#aab4dd" font-family="Jua,sans-serif">서</text>
          </g>
          <path d="M30 14 L34 30 L26 30 Z" fill="#ffd15c"/>
          <circle cx="30" cy="30" r="2.5" fill="#ffd15c"/>
        </svg>
        <div class="alt" id="altTxt"></div>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div id="info" hidden>
      <div class="txt"><h2 id="infoName"></h2><p id="infoText"></p>
        <button class="chip" id="mythBtn">신화 이야기 보기</button>
        <p id="mythText" hidden></p></div>
      <button class="x" id="infoClose" aria-label="닫기">✕</button>
    </div>
    <div id="panel">
      <div class="row" id="rowSeason"><span class="lab">계절</span></div>
      <div class="row" id="rowDir"><span class="lab">방향</span></div>
      <div class="row" id="rowPreset"><span class="lab">바로</span></div>
      <div class="row" id="rowTool"><span class="lab">도구</span></div>
    </div>
  </div>

  <div class="sheet" id="missionSheet" hidden>
    <div class="card">
      <h2>미션 도장판</h2>
      <p class="sub">미션을 누르면 힌트가 나와요. 도장은 이 기기에만 저장돼요.</p>
      <div class="missions" id="missionList"></div>
      <button class="close-wide" id="missionClose">닫기</button>
    </div>
  </div>
  <div class="sheet" id="dirSheet" hidden>
    <div class="card">
      <h2>휴대폰이 어느 쪽을 보고 있나요?</h2>
      <p class="sub" id="dirWhy"></p>
      <div class="row wrap" id="dirChoices" style="flex-wrap:wrap"></div>
      <p class="sub" style="margin-top:12px">모르겠으면 휴대폰의 나침반 앱으로 확인해 보세요. 해가 지는 쪽이 서쪽이에요.</p>
      <button class="close-wide" id="dirClose">닫기</button>
    </div>
  </div>
  <div id="toast"></div>
  <div class="sheet" id="installSheet" hidden>
    <div class="card">
      <h2>앱으로 설치하기</h2>
      <div id="installSteps"></div>
      <p class="tip">설치하면 홈 화면에서 바로 열리고, 인터넷이 없어도 쓸 수 있어요.</p>
      <button class="close-wide" id="installClose">닫기</button>
    </div>
  </div>

  <section id="photo" hidden>
    <header>
      <button class="icon-btn" id="photoBack">← 하늘로</button>
      <h2>사진으로 별자리 찾기</h2>
    </header>
    <div id="pbody">
      <div id="stagecol">
      <div id="stageMsg"></div>
      <div id="stage">
        <canvas id="pcanvas"></canvas>
      </div>
        <div id="adjust" hidden>
          <span class="note">선 맞추기</span>
          <button id="adjL" aria-label="왼쪽으로 돌리기">⟲</button>
          <button id="adjR" aria-label="오른쪽으로 돌리기">⟳</button>
          <button id="adjS" aria-label="작게">－</button>
          <button id="adjB" aria-label="크게">＋</button>
        </div>
      </div>
      <div id="pctrl">
        <div class="row">
          <span class="lab">1. 사진 고르기</span>
          <button class="chip go" id="takeBtn">사진 찍기</button>
          <button class="chip go" id="uploadBtn">사진 올리기</button>
          <span id="sampleChips" style="display:contents"></span>
          <input type="file" id="fileTake" accept="image/*" capture="environment" hidden>
          <input type="file" id="fileUp" accept="image/*" hidden>
        </div>
        <div class="row" id="pDir"><span class="lab">2. 어느 쪽 하늘을 찍었나요?</span></div>
        <div class="row" id="pAlt"><span class="lab">하늘 높이</span></div>
        <div class="row" id="pWhen"><span class="lab">찍은 때</span></div>
        <div class="row"><button class="chip" id="sensorBtn">휴대폰 방향으로 정하기</button><span class="note" id="sensorTxt"></span></div>
        <button class="findBtn" id="findBtn">별자리 찾기</button>
        <div id="results"></div>
        <p class="note" id="photoNote">사진은 이 기기 안에서만 살펴보고, 어디에도 보내지 않아요.</p>
      </div>
    </div>
  </section>

}

/* =========================================================
   하늘 계산 — 날짜·위치로 별이 어디에 보이는지
   세상 좌표: x=동쪽, y=위쪽(천정), -z=북쪽
   ========================================================= */
function lstDeg(date, lon) {
  const jd = date.getTime() / 86400000 + 2440587.5;
  return wrap360(280.46061837 + 360.98564736629 * (jd - 2451545) + lon);
}
function skyMatrix(date, lat, lon) {
  const L = lstDeg(date, lon) * DEG, f = lat * DEG;
  const cL = Math.cos(L), sL = Math.sin(L), cf = Math.cos(f), sf = Math.sin(f);
  const m = new THREE.Matrix4();
  m.set(-sL, cL, 0, 0,
        cL * cf, sL * cf, sf, 0,
        cL * sf, sL * sf, -cf, 0,
        0, 0, 0, 1);
  return m;
}
function eqVec(ra, dec, r = 1) {
  const a = ra * DEG, d = dec * DEG;
  return new THREE.Vector3(r * Math.cos(d) * Math.cos(a), r * Math.cos(d) * Math.sin(a), r * Math.sin(d));
}
function toHorizon(v) { // 세상 좌표 → 방위각·고도
  const n = v.clone().normalize();
  return { alt: Math.asin(clamp(n.y, -1, 1)) / DEG, az: wrap360(Math.atan2(n.x, -n.z) / DEG) };
}
function horizonVec(az, alt) {
  return new THREE.Vector3(Math.cos(alt * DEG) * Math.sin(az * DEG), Math.sin(alt * DEG), -Math.cos(alt * DEG) * Math.cos(az * DEG));
}
function seasonDate(month, day, tz = CONFIG.place.tz) {
  const y = new Date().getFullYear();
  return new Date(Date.UTC(y, month - 1, day, CONFIG.eveningHour - tz, 0));
}
function consCenter(c) { // 별자리 점들의 가운데 방향(적도 좌표)
  if (c._center) return c._center;
  const v = new THREE.Vector3();
  c.p.forEach(p => v.add(eqVec(p[0], p[1])));
  return (c._center = v.normalize());
}
function consHorizon(c, M) { return toHorizon(consCenter(c).clone().applyMatrix4(M)); }

   3D 장면

const canvas = $('sky');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !IS_MOBILE, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 2 : 2.5));

const groundParts = [];  // 땅·산·지평선 빛(카메라 화면을 쓸 땐 숨김)
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CONFIG.fov.start, 1, 0.1, 500);
camera.rotation.order = 'YXZ';

const skyGroup = new THREE.Group(); skyGroup.matrixAutoUpdate = false; scene.add(skyGroup);
let SKY_M = new THREE.Matrix4();

/* 별 */
const starUniforms = { uScale: { value: 1 }, uTime: { value: 0 } };
(function buildStars() {
  const s = DATA.stars, pos = [], col = [], size = [], phase = [];
  for (let i = 0; i < s.length; i += 4) {
    const mag = s[i + 2] / 10; if (mag > CONFIG.maxMag) continue;
    const v = eqVec(s[i] / 10, s[i + 1] / 10, 100); pos.push(v.x, v.y, v.z);
    const bv = s[i + 3] / 10, c = bvColor(bv); col.push(c[0], c[1], c[2]);
    size.push(CONFIG.starSize * Math.max(1.6, (6.2 - mag) * 1.75)); phase.push(Math.random() * 6.28);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('size', new THREE.Float32BufferAttribute(size, 1));
  g.setAttribute('phase', new THREE.Float32BufferAttribute(phase, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: starUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `attribute float size; attribute float phase; attribute vec3 color; varying vec3 vColor; varying float vA;
      uniform float uScale; uniform float uTime;
      void main(){ vec4 wp = modelMatrix * vec4(position,1.0);
        vA = smoothstep(-1.0, 6.0, wp.y) * (0.75 + 0.25*smoothstep(0.0, 25.0, wp.y));
        vColor = color; gl_Position = projectionMatrix * viewMatrix * wp;
        gl_PointSize = size * uScale * (1.0 + 0.07*sin(uTime*2.7 + phase)); }`,
    fragmentShader: `varying vec3 vColor; varying float vA;
      void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.05, d); a *= a;
        gl_FragColor = vec4(vColor * (0.7 + 0.6*a), a * vA); }`,
  });
  const pts = new THREE.Points(g, m); pts.frustumCulled = false; pts.renderOrder = 2; skyGroup.add(pts);
})();
function bvColor(bv) {
  const t = clamp((bv + 0.3) / 2.0, 0, 1);
  const stops = [[0.66, 0.78, 1.0], [0.92, 0.94, 1.0], [1.0, 0.95, 0.82], [1.0, 0.82, 0.6], [1.0, 0.68, 0.5]];
  const f = t * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(f)), k = f - i;
  return stops[i].map((v, j) => v + (stops[i + 1][j] - v) * k);
}

/* 별자리 선 */
const lineMatNormal = () => new THREE.LineBasicMaterial({ color: 0x8fb4ff, transparent: true, opacity: 0.42, depthWrite: false });
CONS.forEach(c => {
  const pos = [];
  c.p.forEach(p => { const v = eqVec(p[0], p[1], 99); pos.push(v.x, v.y, v.z); });
  c._local = c.p.map(p => eqVec(p[0], p[1], 99));
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(c.s);
  c._line = new THREE.LineSegments(g, lineMatNormal()); c._line.renderOrder = 1; c._line.frustumCulled = false; skyGroup.add(c._line);
});

/* 땅과 지평선 */
(function buildGround() {
  const ground = new THREE.Mesh(new THREE.SphereGeometry(90, 48, 12, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x0a1410, side: THREE.BackSide }));
  ground.renderOrder = 3; scene.add(ground); groundParts.push(ground);
  // 산과 나무 실루엣
  const hills = new THREE.CylinderGeometry(88, 88, 1, 180, 1, true);
  const p = hills.attributes.position;
  for (let i = 0; i < p.count; i++) {
    if (p.getY(i) > 0) {
      const a = Math.atan2(p.getZ(i), p.getX(i));
      const h = 1.2 + 1.6 * Math.sin(a * 3 + 1) + 1.1 * Math.sin(a * 7 + 2) + 0.6 * Math.sin(a * 23) + (Math.sin(a * 61) > 0.6 ? 1.6 : 0);
      p.setY(i, Math.max(0.4, h));
    } else p.setY(i, -2);
  }
  const hm = new THREE.Mesh(hills, new THREE.MeshBasicMaterial({ color: 0x050a08, side: THREE.DoubleSide }));
  hm.renderOrder = 3; scene.add(hm); groundParts.push(hm);
  // 지평선 근처의 은은한 빛
  const glow = new THREE.Mesh(new THREE.CylinderGeometry(95, 95, 26, 64, 1, true),
    new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.BackSide,
      vertexShader: 'varying float vy; void main(){ vy = position.y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader: 'varying float vy; void main(){ float a = pow(1.0 - clamp((vy+13.0)/26.0,0.0,1.0), 2.2)*0.55; gl_FragColor = vec4(0.18,0.28,0.55,a);}' }));
  glow.position.y = 13; glow.renderOrder = 0; scene.add(glow); groundParts.push(glow);
})();

/* =========================================================
   화면 크기와 패널을 피한 장면 중심
   ========================================================= */
const viewRect = { l: 0, t: 0, r: 0, b: 0, w: 1, h: 1 };
function isLandscapeSmall() { return matchMedia('(orientation:landscape) and (max-height:560px)').matches; }
function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const top = $('top').getBoundingClientRect(), bottom = $('bottom').getBoundingClientRect(), panel = $('panel').getBoundingClientRect();
  let l = 0, t = top.bottom + 14, r = w, b = h;
  document.documentElement.style.setProperty('--topH', (top.bottom + 22) + 'px');
  if (isLandscapeSmall()) {
    if (!document.body.classList.contains('collapsed')) l = panel.right;
    if (!$('info').hidden) r = $('info').getBoundingClientRect().left;
  } else b = bottom.top;
  Object.assign(viewRect, { l, t, r, b, w: Math.max(50, r - l), h: Math.max(50, b - t) });
  const cx = (l + r) / 2, cy = (t + b) / 2;
  camera.setViewOffset(w, h, w / 2 - cx, h / 2 - cy, w, h);
  camera.updateProjectionMatrix();
}
new ResizeObserver(() => layout()).observe(document.body);
['top', 'bottom', 'panel', 'info'].forEach(id => new ResizeObserver(() => layout()).observe($(id)));
window.addEventListener('resize', layout);

/* =========================================================
   시점 조작: 빈 곳 끌기=둘러보기, 두 손가락·휠=확대, 톡=별자리 고르기
   ========================================================= */
const pointers = new Map(); let drag = null, pinch = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  state.lastInput = performance.now();
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), fov: state.target.fov }; drag = null; }
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); state.lastInput = performance.now();
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    state.target.fov = state.view.fov = clamp(pinch.fov * pinch.d / Math.max(20, d), CONFIG.fov.min, CONFIG.fov.max); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
  if (drag.moved && AR.on) { if (!drag.told) { drag.told = true; say('비춰 보기 중이에요. 휴대폰을 움직여 보세요. 끄려면 ‘비춰 보기 끄기’를 누르세요.'); } return; }
  if (drag.moved) {
    const k = state.view.fov / window.innerHeight;
    state.target.az = state.view.az = wrap360(state.view.az - dx * k);
    state.target.alt = state.view.alt = clamp(state.view.alt + dy * k, -8, 89);
  }
});
function endPointer(e) {
  if (drag && !drag.moved && pointers.size === 1) tapAt(e.clientX, e.clientY, e.pointerType);
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (pointers.size === 0) drag = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); drag = null; pinch = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); state.target.fov = clamp(state.target.fov * Math.exp(e.deltaY * 0.0012), CONFIG.fov.min, CONFIG.fov.max); state.lastInput = performance.now(); }, { passive: false });

const _v = new THREE.Vector3();
function project(vWorld) { // 세상 좌표 → 화면 픽셀(앞에 있으면)
  _v.copy(vWorld).project(camera);
  if (_v.z > 1 || _v.z < -1) return null;
  return { x: (_v.x + 1) / 2 * window.innerWidth, y: (1 - _v.y) / 2 * window.innerHeight };
}
function inFront(vWorld) { const dir = new THREE.Vector3(); camera.getWorldDirection(dir); return dir.dot(vWorld) > 0; }
function tapAt(x, y, type) {
  let best = null, bestD = (type === 'mouse' ? 18 : CONFIG.tapRadius);
  CONS.forEach(c => {
    if (!state.showLines) return;
    const sp = c._local.map(v => { const w = v.clone().applyMatrix4(SKY_M); return (w.y < 0 || !inFront(w)) ? null : project(w); });
    for (let i = 0; i < c.s.length; i += 2) {
      const a = sp[c.s[i]], b = sp[c.s[i + 1]]; if (!a || !b) continue;
      const d = segDist(x, y, a, b); if (d < bestD) { bestD = d; best = c; }
    }
  });
  if (best) selectCons(best.id, false); else { SFX.tap(); }
}
function segDist(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy || 1;
  const t = clamp(((px - a.x) * dx + (py - a.y) * dy) / L, 0, 1);
  return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}

/* =========================================================
   별자리 고르기와 설명
   ========================================================= */
function selectCons(id, fromLabel) {
  const c = CONS_BY_ID[id]; if (!c) return;
  if (state.selected) { const o = CONS_BY_ID[state.selected]; o._line.material.color.set(0x8fb4ff); o._line.material.opacity = 0.42; }
  state.selected = id;
  c._line.material.color.set(0xffd15c); c._line.material.opacity = 1;
  $('infoName').textContent = c.ko;
  $('infoText').textContent = STORIES[id] || `${c.ko}예요. 밝은 별을 선으로 이어 모양을 상상해 보세요. 별 ${c.p.length}개를 이었어요.`;
  $('info').hidden = false;
  $('mythBtn').hidden = !MYTHS[id]; $('mythText').hidden = true; $('mythBtn').textContent = '신화 이야기 보기';
  const h = consHorizon(c, SKY_M);
  say(h.alt > 0 ? `${c.ko}를 찾았어요! ${octName(h.az)}쪽 하늘, 높이 ${Math.round(h.alt)}°에 있어요.` : `${c.ko}는 지금 땅 아래에 있어서 보이지 않아요.`);
  SFX.select();
  state.learned.add(id);
  if (id === 'UMi') stamp('polaris');
  if (id === 'UMa') stamp('dipper');
  if (id === 'Ori') stamp('orion');
  if (state.learned.size >= 5) stamp('five');
}
function clearSelect() {
  if (!state.selected) return;
  const o = CONS_BY_ID[state.selected]; o._line.material.color.set(0x8fb4ff); o._line.material.opacity = 0.42;
  state.selected = null; $('info').hidden = true;
}
$('infoClose').onclick = clearSelect;
$('mythBtn').onclick = () => {
  const t = $('mythText'), id = state.selected; if (!id || !MYTHS[id]) return;
  if (!t.hidden) { t.hidden = true; $('mythBtn').textContent = '신화 이야기 보기'; return; }
  t.textContent = MYTHS[id]; t.hidden = false; $('mythBtn').textContent = '이야기 접기'; SFX.select();
  say(`${CONS_BY_ID[id].ko}에 얽힌 옛이야기예요. 옛날 사람들은 별을 이어 이야기를 만들었어요.`);
  state.mythsRead.add(id); if (state.mythsRead.size >= 3) stamp('myth');
};

/* =========================================================
   날짜·시각과 바라보는 쪽
   ========================================================= */
function setDate(d) {
  state.date = d; SKY_M = skyMatrix(d, state.place.lat, state.place.lon);
  skyGroup.matrix.copy(SKY_M); skyGroup.matrixWorldNeedsUpdate = true; updateClock();
}
function updateClock() {
  const t = new Date(state.date.getTime() + state.place.tz * 3600000);
  const h = t.getUTCHours(), m = t.getUTCMinutes();
  const ap = h < 5 ? '새벽' : h < 12 ? '오전' : h < 18 ? '오후' : '밤';
  const hh = h % 12 === 0 ? 12 : h % 12;
  $('clock').textContent = `${t.getUTCMonth() + 1}월 ${t.getUTCDate()}일 ${ap} ${hh}:${String(m).padStart(2, '0')} · ${state.place.name}`;
}
function lookAt(az, alt, fov) {
  state.target.az = wrap360(az); state.target.alt = clamp(alt, -5, 85); if (fov) state.target.fov = fov;
  state.lastOct = octName(state.target.az); state.lastInput = performance.now() - 300;
}
function lookAtCons(id, fov) {
  const c = CONS_BY_ID[id]; const h = consHorizon(c, SKY_M);
  lookAt(h.az, clamp(h.alt, 12, 70), fov || 75);
}
function famousVisible() { // 지금 잘 보이는 유명한 별자리
  for (const id of FAMOUS) { const h = consHorizon(CONS_BY_ID[id], SKY_M); if (h.alt > 18 && h.alt < 72) return { id, h }; }
  return null;
}
function applySeason(id, quiet) {
  if (AR.on) stopAR();
  const s = SEASONS.find(x => x.id === id); stopPlay();
  setDate(seasonDate(s.month, s.day, state.place.tz)); state.season = id; markChips();
  state.seasonsSeen.add(id); if (state.seasonsSeen.size >= 4) stamp('seasons');
  if (!quiet) { const f = famousVisible(); if (f) lookAt(f.h.az, clamp(f.h.alt, 15, 55)); say(`${s.name} 저녁 9시 하늘이에요. ${s.note}`); SFX.whoosh(); }
}
function tonight() {
  stopPlay(); const now = new Date();
  const t = new Date(now.getTime() + state.place.tz * 3600000);
  setDate(new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate(), CONFIG.eveningHour - state.place.tz, 0)));
  state.season = null; markChips();
}
/* 내 위치 가져오기 — 결과: { ok:true } 또는 { ok:false, why:'이유' } */
function getLocation() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({ ok: false, why: '이 기기는 위치 기능이 없어요' });
    try {
      navigator.geolocation.getCurrentPosition(p => {
        state.place = { name: '내 위치', lat: p.coords.latitude, lon: p.coords.longitude, tz: -new Date().getTimezoneOffset() / 60 };
        res({ ok: true });
      }, err => res({ ok: false, why: err.code === 1 ? '위치 권한이 꺼져 있어요(설정 → 앱/사이트 권한 → 위치 허용)' : err.code === 2 ? '위치를 찾지 못했어요(휴대폰 위치(GPS)가 꺼져 있는지 확인)' : '위치를 찾는 데 시간이 너무 걸렸어요' }),
      { timeout: 15000, maximumAge: 600000, enableHighAccuracy: false });
    } catch (e) { res({ ok: false, why: '위치를 쓸 수 없어요' }); }
  });
}
function goNow() {
  stopPlay(); setDate(new Date()); state.season = 'now'; markChips(); SFX.whoosh();
  say(`지금 이 시각 ${state.place.name} 하늘이에요. 낮이라도 이 앱에선 별을 보여 줘요.`);
  getLocation().then(r => {
    if (r.ok) { setDate(new Date()); say('내 위치의 지금 하늘이에요. 위치는 이 기기 안에서만 써요.'); }
    else say(`${r.why}. ${CONFIG.place.name} 기준으로 보여 줘요.`);
  });
}

function chip(parent, text, onClick, cls = '') { const b = document.createElement('button'); b.className = 'chip ' + cls; b.textContent = text; b.onclick = () => { onClick(b); }; parent.appendChild(b); return b; }
const seasonChips = {};

seasonChips.now = chip($('rowSeason'), '지금', goNow);
DIRECTIONS.forEach(d => chip($('rowDir'), d.name, () => { if (AR.on) stopAR(); lookAt(d.az, 28); state.lastOct = null; SFX.whoosh(); }));
chip($('rowDir'), '머리 위', () => { lookAt(state.view.az, 85, 95); SFX.whoosh(); say('머리 바로 위, 천정을 보고 있어요.'); });
PRESETS.forEach(p => chip($('rowPreset'), p.name, () => runPreset(p)));
const playChip = chip($('rowTool'), '▶ 시간 흐르기', () => state.playing ? stopPlay() : startPlay());
chip($('rowTool'), '선 보기', b => { state.showLines = !state.showLines; b.classList.toggle('on', state.showLines); CONS.forEach(c => c._line.visible = state.showLines); }, 'on');

const missionChip = chip($('rowTool'), '미션 도장', openMissions);

function runPreset(p) {
  if (AR.on) stopAR();
  clearSelect();
  if (p.type === 'tonight') {
    tonight(); const f = famousVisible();
    if (f) { lookAt(f.h.az, clamp(f.h.alt, 15, 55)); say(`오늘 밤 9시 ${state.place.name} 하늘이에요. ${octName(f.h.az)}쪽에 ${CONS_BY_ID[f.id].ko}가 보여요.`); }
    SFX.whoosh(); return;
  }
  applySeason(p.season, true); lookAtCons(p.target, 70);
  setTimeout(() => { selectCons(p.target); say(p.note); }, 450);
}
function startPlay() { state.playing = true; playChip.classList.add('on'); playChip.textContent = '⏸ 멈추기'; say('시간이 빠르게 흘러요. 별들이 북극성을 중심으로 천천히 돌아요.'); stamp('time'); state.season = null; markChips(); }

$('menuBtn').onclick = () => { document.body.classList.toggle('collapsed'); $('menuBtn').textContent = document.body.classList.contains('collapsed') ? '메뉴 열기' : '메뉴 닫기'; layout(); SFX.tap(); };

  Promise.resolve(req.call(el)).catch(() => say('여기서는 전체화면을 쓸 수 없어요.'));
};

function renderMissions() {
  const box = $('missionList'); box.innerHTML = '';
  MISSIONS.forEach(m => {
    const b = document.createElement('button'); b.className = 'mission' + (state.stamps[m.id] ? ' done' : '');
